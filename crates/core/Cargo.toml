[package]
name = "wisp_core"
version = "0.19.0"
edition = "2024"
description = "Wisp Study's library engine: papers, custom fields, SQLite store, import and export. No GPUI."
license = "MIT"

[dependencies]
anyhow = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
pdf-extract = "0.9"
hayro-interpret = "0.9"
# Writing a PDF anew, its pictures smaller (`shrink.rs`): the lopdf pdf-extract reads with, and the JPEG codec.
lopdf = { version = "0.36", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Word files are zip archives, packed with deflate (`docx.rs`); the PDF readers bring it along already.
flate2 = "1"
icu_segmenter = "2"
# CSL citation styles, the files Zotero uses (`csl.rs`); `archive` carries the common styles and every locale.
hayagriva = { version = "0.10", default-features = false, features = ["archive", "csl-json"] }
# Mermaid diagrams as SVG without a browser (`mermaid.rs`). Not the default features: those bring the ELK layout, which is EPL-2.0.
merman = { version = "0.11", default-features = false, features = ["svg", "layout-cytoscape", "all-diagrams"] }

[lints]
workspace = true
